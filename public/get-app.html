<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Platio</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#FBF6EF;color:#1B1614;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    a{color:#D7191F;font-weight:700}
    p{max-width:360px;line-height:1.6;color:#6d625a}
  </style>
</head>
<body>
  <div>
    <h1 style="font-weight:500;margin-bottom:12px">Get Platio</h1>
    <p id="msg">Opening the app store…</p>
    <p style="margin-top:20px;font-size:14px">
      <a id="ios" href="https://apps.apple.com/in/app/platio-meals/id6827652613">App Store</a>
      ·
      <a id="android" href="https://play.google.com/store/apps/details?id=com.platio.kitchen">Google Play</a>
    </p>
  </div>
  <script>
    var ios = 'https://apps.apple.com/in/app/platio-meals/id6827652613';
    var android = 'https://play.google.com/store/apps/details?id=com.platio.kitchen';
    var ua = navigator.userAgent || '';
    var msg = document.getElementById('msg');
  if (/iPhone|iPad|iPod/i.test(ua)) {
      window.location.replace(ios);
    } else if (/Android/i.test(ua)) {
      window.location.replace(android);
    } else {
      msg.textContent = 'Choose your store below.';
    }
  </script>
</body>
</html>
